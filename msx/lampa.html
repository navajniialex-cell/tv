<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лампа - ТехноШаман TV</title>
  <style>
    body { background: #141414; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  </style>
</head>
<body>
  <div>Загрузка Lampa...</div>
  <script>
    (function () {
      if (!localStorage.getItem('ts_lampa_configured')) {
        localStorage.setItem('language', 'ru');
        localStorage.setItem('source', 'tmdb');
        localStorage.setItem('tmdb_proxy', 'true');
        localStorage.setItem('background', 'false');
        localStorage.setItem('glass_style', 'false');
        localStorage.setItem('ts_lampa_configured', '1');
      }

      var defaultPlugins = [
        { url: 'https://bwa.to/rc', status: 1, name: 'BWA Online', author: 'bwa' },
        { url: 'https://nb557.github.io/plugins/online_mod.js', status: 1, name: 'Online Mod', author: 'nb557' }
      ];

      try {
        var saved = JSON.parse(localStorage.getItem('plugins') || '[]');
        saved = saved.filter(function (p) { return p.url.indexOf('iptv.js') === -1; });
        defaultPlugins.forEach(function (def) {
          if (!saved.some(function (p) { return p.url === def.url; })) saved.push(def);
        });
        localStorage.setItem('plugins', JSON.stringify(saved));
      } catch (e) {
        localStorage.setItem('plugins', JSON.stringify(defaultPlugins));
      }

      var fixScript = '<script>' +
        'window.addEventListener("error",function(e){if(e&&e.message&&e.message.indexOf("Script error")!==-1){e.stopImmediatePropagation();e.preventDefault();}},true);' +
        'function _tsLock(){try{history.pushState({lampa:1},"",location.href);}catch(e){}}' +
        '_tsLock();' +
        'window.addEventListener("popstate",function(){_tsLock();if(window.Lampa&&Lampa.Controller){Lampa.Controller.back();}});' +
        '<\/script>';

      fetch('https://yumata.github.io/lampa/index.html')
        .then(function (r) { return r.text(); })
        .then(function (html) {
          html = html.replace('<head>', '<head><base href="https://yumata.github.io/lampa/">' + fixScript);
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          location.href = 'http://lampa.mx';
        });
    })();
  </script>
</body>
</html>
