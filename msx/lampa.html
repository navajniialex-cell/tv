<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lampa - ТехноШаман TV</title>
    <base href="https://yumata.github.io/lampa/">
    <link rel="stylesheet" href="./css/app.css">
    <script>
        (function () {
            // Базовые настройки для стабильной работы на ТВ и загрузки постеров
            if (!localStorage.getItem('ts_lampa_configured')) {
                localStorage.setItem('language', 'ru');
                localStorage.setItem('source', 'tmdb');
                localStorage.setItem('tmdb_proxy', 'true');
                localStorage.setItem('background', 'false');
                localStorage.setItem('glass_style', 'false');
                localStorage.setItem('ts_lampa_configured', '1');
            }

            // Предустановка рабочих онлайн-плагинов
            var defaultPlugins = [
                { url: 'https://bwa.to/rc', status: 1, name: 'BWA Online', author: 'bwa' },
                { url: 'https://nb557.github.io/plugins/online_mod.js', status: 1, name: 'Online Mod', author: 'nb557' },
                { url: 'https://nb557.github.io/plugins/iptv.js', status: 1, name: 'IPTV Channels', author: 'nb557' }
            ];

            try {
                var saved = JSON.parse(localStorage.getItem('plugins') || '[]');
                defaultPlugins.forEach(function (def) {
                    var exists = saved.some(function (p) { return p.url === def.url; });
                    if (!exists) saved.push(def);
                });
                localStorage.setItem('plugins', JSON.stringify(saved));
            } catch (e) {
                localStorage.setItem('plugins', JSON.stringify(defaultPlugins));
            }
        })();
    </script>
</head>
<body>
    <div class="welcome"></div>
    <div id="app"></div>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scroll/scroll.js"></script>
    <script src="./vender/keypad/keypad.js"></script>
    <script src="./app.min.js"></script>
</body>
</html>
